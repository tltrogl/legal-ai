<div class="flex flex-col h-screen">
  <header class="bg-slate-800 text-white shadow-md z-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 text-sky-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
          </svg>
          <h1 class="text-xl font-bold tracking-tight">Lexi AI Legal Assistant</h1>
        </div>
      </div>
      <nav class="-mb-px flex space-x-6" aria-label="Tabs">
         <button
          (click)="selectTab('home')"
          [class.border-sky-400]="activeTab() === 'home'"
          [class.text-white]="activeTab() === 'home'"
          [class.border-transparent]="activeTab() !== 'home'"
          [class.text-slate-300]="activeTab() !== 'home'"
          class="hover:text-white hover:border-sky-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm transition-colors duration-200">
          Home
        </button>
        <button
          (click)="selectTab('chat')"
          [class.border-sky-400]="activeTab() === 'chat'"
          [class.text-white]="activeTab() === 'chat'"
          [class.border-transparent]="activeTab() !== 'chat'"
          [class.text-slate-300]="activeTab() !== 'chat'"
          class="hover:text-white hover:border-sky-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm transition-colors duration-200">
          Case Chat
        </button>
        <button
          (click)="selectTab('evidence')"
          [class.border-sky-400]="activeTab() === 'evidence'"
          [class.text-white]="activeTab() === 'evidence'"
          [class.border-transparent]="activeTab() !== 'evidence'"
          [class.text-slate-300]="activeTab() !== 'evidence'"
          class="hover:text-white hover:border-sky-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm transition-colors duration-200">
          Evidence Analyzer
        </button>
        <button
          (click)="selectTab('research')"
          [class.border-sky-400]="activeTab() === 'research'"
          [class.text-white]="activeTab() === 'research'"
          [class.border-transparent]="activeTab() !== 'research'"
          [class.text-slate-300]="activeTab() !== 'research'"
          class="hover:text-white hover:border-sky-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm transition-colors duration-200">
          Legal Research
        </button>
        <button
          (click)="selectTab('management')"
          [class.border-sky-400]="activeTab() === 'management'"
          [class.text-white]="activeTab() === 'management'"
          [class.border-transparent]="activeTab() !== 'management'"
          [class.text-slate-300]="activeTab() !== 'management'"
          class="hover:text-white hover:border-sky-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm transition-colors duration-200">
          Case Management
        </button>
      </nav>
    </div>
  </header>

  <main class="flex-grow overflow-y-auto bg-slate-100">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8 h-full">
      @switch (activeTab()) {
        @case ('home') {
          <app-home (navigateTo)="selectTab($event)" />
        }
        @case ('chat') {
          <app-case-chat />
        }
        @case ('evidence') {
          <app-evidence-analyzer />
        }
        @case ('research') {
          <app-legal-research />
        }
        @case ('management') {
          <app-case-management />
        }
      }
    </div>
  </main>
</div>
